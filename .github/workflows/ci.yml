name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    name: "Game logic tests (g++)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Build and run the tests"
        run: make -C tools test -j"$(nproc)"
      - name: "Same tests, warnings are errors"
        run: make -C tools clean && make -C tools test -j"$(nproc)" CXXFLAGS="-std=c++20 -O0 -Wall -Wextra -Wno-unused-parameter -Werror"

  audio-tools:
    name: "Sound and music tools (Python)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install the Python packages"
        run: pip install numpy scipy soundfile
      - name: "Sound effects - every recipe renders and matches the table of the engine"
        run: python tools/audio/build_sfx.py --check
      - name: "Music - every score is analysed"
        run: python tools/audio/build_bgm.py --check
